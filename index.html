<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EchoDeck Pro — 상황별 영어 표현 & SRS 쉐도잉</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --accent: #0f766e;
      --danger: #dc2626;
      --warn: #d97706;
      --success: #16a34a;
      --radius: 14px;
      --shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 80px;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 13px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand span {
      background: linear-gradient(135deg, #2563eb, #0f766e);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .stats-pill {
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .stats-pill strong { color: var(--primary); }

    nav.tabs {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      gap: 6px;
      padding: 0 18px 10px;
    }
    .tab-btn {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      padding: 9px 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    main {
      max-width: 920px;
      margin: 18px auto;
      padding: 0 18px;
    }
    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 8px 13px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #f8fafc; }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { background: #1d4ed8; }
    button.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--danger); border-color: #fecaca; background: #fef2f2; }
    button.sm { padding: 5px 10px; font-size: 0.78rem; }

    select, input[type="text"], input[type="number"] {
      font-family: inherit;
      font-size: 0.88rem;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
    }

    /* Category Filter Chips */
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* YouTube Player Wrapper */
    .yt-box {
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
      display: none;
    }
    .yt-box.visible { display: block; }
    .yt-aspect {
      position: relative;
      width: 100%;
      padding-top: 42%;
    }
    @media (max-width: 640px) {
      .yt-aspect { padding-top: 56.25%; }
    }
    .yt-aspect iframe, #ytPlayerContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .yt-bar {
      background: #1e293b;
      color: #e2e8f0;
      padding: 8px 12px;
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sentence-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 15px;
      margin-bottom: 10px;
      transition: 0.15s;
    }
    .sentence-item.playing {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .time-chip {
      display: inline-block;
      font-size: 0.72rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #e2e8f0;
      color: #334155;
      padding: 1px 6px;
      border-radius: 5px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .key-expr-tag {
      display: inline-block;
      font-size: 0.74rem;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 1px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .en-line {
      font-size: 1.04rem;
      font-weight: 600;
      margin-bottom: 5px;
      word-spacing: 2px;
    }
    .word-token {
      cursor: pointer;
      border-radius: 4px;
      padding: 1px 2px;
    }
    .word-token:hover {
      background: #dbeafe;
      color: var(--primary);
    }
    .ko-line {
      font-size: 0.87rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .sentence-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .stt-result {
      margin-top: 8px;
      font-size: 0.82rem;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #334155;
      display: none;
    }

    .quick-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      display: none;
    }
    .quick-box.open { display: block; }
    .dict-preview {
      font-size: 0.82rem;
      color: #334155;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .form-grid-4 {
      display: grid;
      grid-template-columns: 2fr 2fr 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    @media (max-width: 640px) {
      .form-grid, .form-grid-4 { grid-template-columns: 1fr; }
    }

    /* SRS Flashcard & Cloze */
    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .flashcard {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 26px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }
    .fc-cat {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: #ecfdf5;
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .fc-word {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .fc-ipa {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .fc-example {
      font-size: 0.96rem;
      color: #334155;
      max-width: 560px;
      margin-bottom: 14px;
    }
    .cloze-input-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 400px;
    }
    .cloze-input-wrap input { flex: 1; text-align: center; font-weight: 600; }
    .fc-answer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      width: 100%;
      max-width: 560px;
      display: none;
    }
    .fc-answer.visible { display: block; }
    .fc-meaning {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .srs-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .srs-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 6px;
      font-size: 0.82rem;
    }
    .srs-btn small { font-weight: 400; color: var(--muted); font-size: 0.72rem; }
    .srs-again { border-color: #fca5a5; color: var(--danger); }
    .srs-hard { border-color: #fcd34d; color: var(--warn); }
    .srs-good { border-color: #93c5fd; color: var(--primary); }
    .srs-easy { border-color: #86efac; color: var(--success); }

    /* Deck List */
    .deck-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .deck-item:last-child { border-bottom: none; }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }
    .badge.due { background: #fef3c7; color: #b45309; }
    .badge.cat { background: #f1f5f9; color: #475569; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 60;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">EchoDeck <span>상황별 표현 PACK</span></div>
      <div class="stats-pill">오늘 복습: <strong id="dueCountBadge">0</strong> · 전체 <strong id="totalCountBadge">0</strong></div>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="shadowing">1. 상황별 쉐도잉</button>
      <button class="tab-btn" data-tab="srs">2. SRS 복습</button>
      <button class="tab-btn" data-tab="deck">3. 상황별 단어장</button>
    </nav>
  </header>

  <main>
    <!-- TAB 1: SHADOWING -->
    <section id="view-shadowing" class="view active">
      <div class="card">
        <div class="card-title">
          <span>상황별 핵심 문장 쉐도잉</span>
          <button id="resetAllPresetBtn" class="sm">🔄 기본 상황 데이터 초기화</button>
        </div>

        <div class="chip-row" id="shadowingCategoryChips"></div>

        <div class="controls-bar">
          <select id="scriptSelect"></select>
          <label style="font-size:0.82rem; color:var(--muted);">속도
            <select id="rateSelect">
              <option value="0.75">0.75x</option>
              <option value="0.9">0.9x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.15">1.15x</option>
            </select>
          </label>
          <button id="stopSpeechBtn" class="sm">⏹ 정지</button>
          <button id="toggleYtSetupBtn" class="sm">🎬 YouTube 연결</button>
          <button id="toggleAddScriptBtn" class="sm">+ 문장 추가</button>
        </div>

        <!-- YouTube URL Setup Drawer -->
        <div id="ytSetupBox" class="quick-box">
          <strong>현재 상황에 YouTube 영상 연결</strong>
          <p style="font-size:0.8rem; color:var(--muted); margin-top:2px;">GitHub Pages(https://) 환경에서 유튜브 URL 또는 11자리 영상 ID를 입력하면 구간 재생됩니다.</p>
          <div class="form-grid" style="margin-top:8px;">
            <input type="text" id="ytUrlInput" placeholder="예: https://youtu.be/영상ID 또는 11자리 ID" />
            <div style="display:flex; gap:6px;">
              <button id="applyYtBtn" class="primary sm">영상 적용</button>
              <button id="clearYtBtn" class="sm">연결 해제</button>
            </div>
          </div>
        </div>

        <!-- YouTube Player -->
        <div id="ytPlayerBox" class="yt-box">
          <div class="yt-aspect">
            <div id="ytPlayerContainer"></div>
          </div>
          <div class="yt-bar">
            <span id="ytStatusText">YouTube 구간 싱크 대기 중</span>
            <button id="captureTimeBtn" class="sm" style="background:#334155; color:#fff; border-color:#475569;">현재 재생초 확인</button>
          </div>
        </div>

        <!-- Custom Sentence Add -->
        <div id="customScriptBox" class="quick-box">
          <strong>현재 상황 스크립트에 새 문장 추가</strong>
          <div class="form-grid-4">
            <input type="text" id="newEnSentence" placeholder="영어 문장" />
            <input type="text" id="newKoSentence" placeholder="한국어 해석" />
            <input type="number" id="newStartSec" step="0.1" placeholder="시작(초)" />
            <input type="number" id="newEndSec" step="0.1" placeholder="종료(초)" />
          </div>
          <div style="margin-top:8px;">
            <button id="saveCustomSentenceBtn" class="primary sm">문장 등록</button>
          </div>
        </div>

        <!-- Dictionary Lookup & Quick Word Save -->
        <div id="quickWordBox" class="quick-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>사전 조회 & 상황별 단어장 담기</strong>
            <button id="closeQuickWordBtn" class="sm">닫기</button>
          </div>
          <div id="dictPreview" class="dict-preview">단어를 불러오는 중...</div>
          <div class="form-grid">
            <input type="text" id="qwExpr" placeholder="단어 또는 숙어" />
            <input type="text" id="qwMeaning" placeholder="한국어 뜻 입력" />
            <select id="qwCategory"></select>
            <input type="text" id="qwIpa" placeholder="발음기호 (자동 채움)" />
            <input type="text" id="qwExample" placeholder="예문" style="grid-column: 1 / -1;" />
          </div>
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button id="qwSaveBtn" class="primary sm">SRS 단어장에 저장</button>
            <button id="qwSpeakBtn" class="sm">🔊 발음 듣기</button>
          </div>
        </div>

        <div id="sentenceList"></div>
      </div>
    </section>

    <!-- TAB 2: SRS REVIEW -->
    <section id="view-srs" class="view">
      <div class="card">
        <div class="card-title">
          <span>간격 반복(SRS) 복습 큐</span>
          <div class="mode-switch">
            <button id="modeFlipBtn" class="sm primary">플래시카드</button>
            <button id="modeClozeBtn" class="sm">빈칸 타이핑</button>
            <button id="practiceAllBtn" class="sm">전체 연습</button>
          </div>
        </div>
        <div class="chip-row" id="srsCategoryChips"></div>
        <div id="srsContainer"></div>
      </div>
    </section>

    <!-- TAB 3: DECK MANAGEMENT -->
    <section id="view-deck" class="view">
      <div class="card">
        <div class="card-title">
          <span>새 표현 직접 추가</span>
        </div>
        <div class="form-grid">
          <input type="text" id="addExpr" placeholder="영어 표현 (예: on the same page)" />
          <input type="text" id="addMeaning" placeholder="한국어 뜻 (예: 같은 생각인, 의견이 일치하는)" />
          <select id="addCategory"></select>
          <input type="text" id="addIpa" placeholder="발음기호 (선택)" />
          <input type="text" id="addExample" placeholder="예문 입력" style="grid-column: 1 / -1;" />
        </div>
        <div style="margin-top:10px;">
          <button id="addCardBtn" class="primary">단어장에 추가</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>상황별 단어·표현장</span>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            <button id="exportJsonBtn" class="sm">JSON 백업</button>
            <label class="sm" style="border:1px solid var(--border); padding:5px 10px; border-radius:9px; font-size:0.78rem; font-weight:600; cursor:pointer; background:#fff;">
              JSON 복원
              <input type="file" id="importJsonInput" accept=".json" style="display:none;" />
            </label>
          </div>
        </div>
        <div class="chip-row" id="deckCategoryChips"></div>
        <input type="text" id="deckSearchInput" placeholder="표현, 뜻, 예문 검색..." style="width:100%; margin-bottom:12px;" />
        <div id="deckList"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const STORAGE_KEY = "echodeck_cards_v4";

          {
